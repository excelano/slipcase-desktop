[package]
name = "slipcase-desktop"
description = "Open a slipcase container, read its metadata, and hand the payload to the application the system has registered for it"
homepage = "https://github.com/excelano/slipcase"
readme = "README.md"
keywords = ["slipcase", "container", "metadata", "gui", "egui"]
categories = ["gui", "filesystem"]
version = "0.1.0"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/slipcase-desktop"
# eframe's number, not this code's: nothing written here needs past edition
# 2021's 1.56, and every other crate in the tree sits below eframe. It rises
# whenever egui raises its own, so measure rather than trust this line.
# DESIGN.md §2.
rust-version = "1.95"

[[bin]]
name = "slipcase-desktop"
path = "src/main.rs"

[dependencies]
# The `fs` feature is the library's file-placement half. `Destination`, which
# DESIGN.md §5 writes edited metadata back through, is behind it and is
# compiled out without it.
slpc = { version = "0.3.4", features = ["fs"] }
# Defaults carry accesskit, which DESIGN.md §3 keeps on.
eframe = "0.36"
# Defaults are `xdg-portal` and `wayland`, both pure Rust. The `gtk3` feature
# links C through gtk-sys and stays off, which is what taking the defaults
# does — naming features here would be the way to turn it on by accident.
rfd = "0.17"
# Hands a path to the platform's own mechanism rather than carrying a table of
# programs to run. DESIGN.md §3.
opener = "0.8"
# The directory extraction goes to. Already in the tree under slpc's `fs`
# feature, so this compiles nothing new. Named here rather than hand-rolled
# because a directory built from a process id is wrong twice: a crashed run
# leaves one behind for whoever next holds that id, and `create_dir` leaves it
# readable by everyone on the machine. `TempDir` is 0700 and unguessable, and
# removes its tree when it drops. DESIGN.md §5.
tempfile = "3.27"

[target.'cfg(target_os = "windows")'.dependencies]
# Reading the window's icon out of the `.ico` the installer also registers.
# Windows takes a window icon from a resource compiled into the executable, and
# a resource compiler is exactly what DESIGN.md §2 keeps out of the build, so
# the icon is embedded as bytes and decoded at startup instead. Pure Rust; its
# `png` is for the large entries, which are stored that way.
ico = "0.5.0"
# What the platform would open a payload with, which on Windows is a question
# for the registry. `AssocQueryString` is the textbook answer and is a raw FFI
# call this crate cannot make under `#![forbid(unsafe_code)]`; this is a safe
# API over the same hive, with its unsafe inside it as `rfd` and `opener`
# already have theirs. Pure Rust, no build script, and its three dependencies
# were already in the tree under `eframe`, so it compiles one new crate.
# DESIGN.md §3.
windows-registry = "0.6.1"
