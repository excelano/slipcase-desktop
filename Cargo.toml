[package]
name = "slipcase-desktop"
description = "Open a slipcase container, read its metadata, and hand the payload to the application the system has registered for it"
homepage = "https://github.com/excelano/slipcase"
readme = "README.md"
keywords = ["slipcase", "container", "metadata", "gui", "egui"]
categories = ["gui", "filesystem"]
version = "0.1.0"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/slipcase-desktop"
# eframe's number, not this code's: nothing written here needs past edition
# 2021's 1.56, and every other crate in the tree sits below eframe. It rises
# whenever egui raises its own, so measure rather than trust this line.
# DESIGN.md §2.
rust-version = "1.95"

[[bin]]
name = "slipcase-desktop"
path = "src/main.rs"

[dependencies]
# The `fs` feature is the library's file-placement half. `Destination`, which
# DESIGN.md §5 writes edited metadata back through, is behind it and is
# compiled out without it.
slpc = { version = "0.3.4", features = ["fs"] }
# Defaults carry accesskit, which DESIGN.md §3 keeps on.
eframe = "0.36"
# Defaults are `xdg-portal` and `wayland`, both pure Rust. The `gtk3` feature
# links C through gtk-sys and stays off, which is what taking the defaults
# does — naming features here would be the way to turn it on by accident.
rfd = "0.17"
# Hands a path to the platform's own mechanism rather than carrying a table of
# programs to run. DESIGN.md §3.
opener = "0.8"
# The directory extraction goes to. Already in the tree under slpc's `fs`
# feature, so this compiles nothing new. Named here rather than hand-rolled
# because a directory built from a process id is wrong twice: a crashed run
# leaves one behind for whoever next holds that id, and `create_dir` leaves it
# readable by everyone on the machine. `TempDir` is 0700 and unguessable, and
# removes its tree when it drops. DESIGN.md §5.
tempfile = "3.27"

# Launch Services answers `opens_with` on macOS, and it is a C API this crate
# cannot call: `#![forbid(unsafe_code)]` is a property of this source. These
# four carry that unsafe on our behalf, the way `rfd` and `opener` already do,
# and every call `src/opens_with.rs` makes into them is a safe function — the
# module compiles under `forbid` with no unsafe block in it.
#
# Already in the tree on this target under `winit`, `rfd`, and `arboard`, so
# only `objc2-uniform-type-identifiers` is new. Features are named rather than
# taken, and not for weight alone: `cargo add` takes 176 features of
# `objc2-foundation` and rustc 1.98.0 segfaults in LLVM's debug-info emission
# compiling that. The narrow set below is also what the rest of the tree
# already enables.
[target.'cfg(target_os = "macos")'.dependencies]
# `Retained`, which the other three return and none of them re-export.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# `UTType`, which turns a filename extension into a type without a file.
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
# `NSWorkspace`, which names the application for a type. The feature named
# after the crate above is what exposes the query that takes a `UTType`.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "objc2-uniform-type-identifiers"] }
# `NSBundle`, for what an application calls itself, and the strings and URLs
# the other two speak in.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSBundle"] }
