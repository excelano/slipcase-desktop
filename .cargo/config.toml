# The Visual C++ runtime is not part of Windows. A binary that links it
# dynamically installs on a clean machine and then refuses to start: *The code
# execution cannot proceed because VCRUNTIME140.dll was not found.* That DLL
# ships in the Visual C++ Redistributable, which Windows does not carry and a
# clean machine does not have. Every machine this project builds on has Visual
# Studio, so none of them shows the failure.
#
# `+crt-static` links the VC runtime and the UCRT into the binary, so
# VCRUNTIME140.dll and the api-ms-win-crt-* imports are gone and every
# remaining import is a DLL that ships with Windows. `packaging/windows/check-imports.ps1` is the check that
# says so, and `build-msix.ps1` will not package a binary that fails it.
#
# What it costs: a CRT security fix needs a rebuild of this application, where
# a dynamically linked one would pick it up from a serviced DLL.
#
# Declaring a `Microsoft.VCLibs.140.00.UWPDesktop` framework dependency in the
# manifest is the alternative, which is what Store policy 10.2.4.1 means by
# disclosing it. It is declined: it answers the paperwork by making the application
# depend on something the machine has to acquire before it can start, and this
# application otherwise depends on nothing that is not already on the machine.
# Removing the dependency is a better answer to 10.2.4.1 than declaring it.
#
# This key names the triple, so Linux and macOS builds are untouched.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
