[locales."en-us"]
website = "https://excelano.com/slipcase/"
support = "https://excelano.com/slipcase/"
privacy = "https://excelano.com/legal/#slipcase"
description = """
A Slipcase container is one file holding a document of any type together with a flyleaf describing it. Copy the container, send it, or move it to another machine and the flyleaf goes too — instead of living in a filename that gets truncated, a sidecar file that gets separated, or a database on somebody else's computer.

Slipcase opens a container and shows what is inside, and makes one out of a file you choose.

WHAT YOU SEE

The content file's name and size. What your operating system says would open it. The flyleaf as a tree, with every value editable in place. And the container's verdict against the specification, in the specification's own words — including the two answers that are neither a pass nor a failure: a container whose flyleaf cannot be read is undetermined, and one written to a newer version of the format is out of scope.

WHAT YOU CAN DO

Open hands the content file to whatever application is registered for that kind of file. Extract writes it somewhere you choose. Replace swaps it for a different file. Save writes an edited flyleaf document back — keeping your comments, your key order, and any whitespace you did not touch, along with anything else in the container that Slipcase does not recognise.

A rewrite is read back and checked before it replaces anything, so a save that would produce a container the format does not accept changes nothing on disk. A container you did not change is not rewritten at all.

New container asks which file to put in and where the container should go, writes it, and then opens it, so the flyleaf is filled in where the rest of it gets edited. A large content file packs with a progress bar and a Stop, and stopping leaves nothing behind. A file the format will not accept as a content file is refused when you choose it, rather than after you have said where the container goes.

WHAT IT TELLS YOU, AND DOES NOT DECIDE FOR YOU

Slipcase reports. It does not gate.

If a container arrived from elsewhere — downloaded, or sent to you — Slipcase says so, and the content file you extract is marked as well, so your computer treats it with the caution it gives anything that came from outside rather than opening it as though you had made it yourself. Editing the flyleaf and saving does not quietly erase that: Slipcase still tells you where the container came from afterwards. It travels the other way too: a file that arrived from elsewhere still says so on the container you pack it into.

On macOS it tells you when a content file was stored as an executable file, and that the copy you extract will not be. That is read out of the container rather than guessed from its name.

Names are shown with the characters that reorder text written out, so a content file cannot present itself as one kind of file while being another.

Where your operating system will not say what opens a content file, Slipcase says nothing rather than guessing. It ships no table matching filenames to types and never inspects a content file's contents to guess at one. What you get is information — where the file came from, what it was, whether the container is well formed — and the decision stays yours.

WHAT IT DOES NOT DO

No network connection of any kind. No account. No telemetry, no analytics, no crash reporting. Nothing about you or your files is sent anywhere, because there is nowhere for it to be sent.

It shows no preview: the content file is handed to another application rather than rendered here. A container holds one content file, which is the format's decision rather than this application's.

OPEN SOURCE

Slipcase is open source, and so is the format it reads and the library that reads it. Every claim above is checkable: github.com/excelano/slipcase-desktop.
"""

[locales."en-us".apple]
name = "Slipcase Desktop"
subtitle = "A flyleaf that travels along"
promotional-text = "Make a container out of a file, or open one and read the flyleaf that travelled with it. Edit that flyleaf in place, and hand the content file to whatever opens it."
keywords = "flyleaf,container,slpc,archive,toml,file,document,tagging,zip,viewer"

