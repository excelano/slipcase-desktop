# The copy both store listings are filled in from.
#
# Every line of this is a claim about the code, and a claim like that goes
# stale silently in a web form nobody diffs. So it lives here, is reviewed and
# committed like anything else, and `ship` pushes it to both stores on every
# release. Edit here; do not edit a listing in a browser.
#
# The fields both stores take sit at the top of a language. The rest sit under
# the store that takes them, because the two do not take the same fields and do
# not count them the same way. The name is under each store because the two can
# disagree about it.
#
# Limits, which ship checks before the tag and counts in characters rather than
# bytes: apple.name and apple.subtitle 30, apple.promotional-text 170,
# apple.keywords 100 including the commas, description 4,000 - the Microsoft
# Store allows 10,000 and this is written to Apple's - microsoft.short-description
# 500, microsoft.features 20 of 200, microsoft.keywords 7 of 30.
#
# What is *not* here is what changed in this release. That is
# release-notes.toml, which is rewritten every time; this changes when the
# product does.
#
# No URLs reach the Microsoft Store from here. Its submission document has no
# field for them: Partner Center keeps the website, the privacy policy and the
# support contact against the product. Measured 2026-09-16.
#
# THE GERMAN HALF
#
# Terminology is the application's own, out of the catalogue at `po/de.po`. A
# listing that calls a thing something the window does not teaches a reader a
# word the product has no use for, so where the catalogue has a term it wins.
#
# German runs longer than English, which is what the limits above are for:
# `ship` counts every field before the tag, in characters rather than bytes,
# and a release stops rather than a submission failing.

[locales."de-de"]
website = "https://excelano.com/slipcase/"
support = "https://excelano.com/slipcase/"
privacy = "https://excelano.com/legal/#slipcase"
description = """
Ein Slipcase-Container ist eine Datei, die ein Dokument beliebigen Typs zusammen mit dem Flyleaf enthält, das es beschreibt. Kopieren, senden oder verschieben Sie den Container — das Flyleaf geht mit. Statt in einem Dateinamen zu stecken, der abgeschnitten wird, in einer Begleitdatei, die verlorengeht, oder in der Datenbank eines anderen.

Slipcase öffnet einen Container und zeigt, was darin ist, und erstellt einen aus einer Datei Ihrer Wahl.

WAS SIE SEHEN

Name und Größe der Inhaltsdatei. Womit Ihr System sie öffnen würde. Das Flyleaf als Baum, jeder Wert an Ort und Stelle bearbeitbar. Und das Urteil des Containers gegenüber der Spezifikation, in deren eigenen Worten — einschließlich der beiden Antworten, die weder Bestehen noch Scheitern sind: unbestimmt, wenn das Flyleaf nicht gelesen werden kann, und außerhalb des Geltungsbereichs, wenn er für eine neuere Fassung des Formats geschrieben wurde.

WAS SIE TUN KÖNNEN

Öffnen übergibt die Inhaltsdatei dem Programm, das für diesen Dateityp vorgesehen ist. Entpacken schreibt sie, wohin Sie wollen. Ersetzen tauscht sie gegen eine andere Datei. Speichern schreibt das bearbeitete Flyleaf zurück — und behält dabei Ihre Kommentare, Ihre Schlüsselreihenfolge und jeden Leerraum, den Sie nicht angefasst haben, samt allem anderen im Container, das Slipcase nicht kennt.

Neu Geschriebenes wird zurückgelesen und geprüft, bevor es etwas ersetzt: ein Speichern, das einen Container ergäbe, den das Format nicht annimmt, ändert nichts auf der Platte. Ein Container, den Sie nicht geändert haben, wird gar nicht erst neu geschrieben.

Neuer Container fragt, welche Datei hinein soll und wohin der Container gehört, schreibt ihn und öffnet ihn dann, damit das Flyleaf dort entsteht, wo es auch bearbeitet wird. Eine große Inhaltsdatei packt mit Fortschrittsbalken und Anhalten, und Anhalten lässt nichts zurück. Eine Datei, die das Format nicht als Inhaltsdatei annimmt, wird abgelehnt, sobald Sie sie wählen.

WAS ES IHNEN SAGT UND NICHT FÜR SIE ENTSCHEIDET

Slipcase berichtet. Es hält nichts auf.

Kam ein Container von anderswo — heruntergeladen oder Ihnen geschickt —, sagt Slipcase das, und auch die entpackte Inhaltsdatei wird markiert, damit Ihr System sie mit der Vorsicht behandelt, die es allem von außen entgegenbringt, statt sie zu öffnen, als wäre sie Ihre eigene. Das Flyleaf zu bearbeiten und zu speichern löscht das nicht still: Slipcase sagt Ihnen danach weiterhin, woher der Container kam. Es gilt auch andersherum: eine Datei von anderswo sagt das weiterhin auf dem Container, in den Sie sie packen.

Unter macOS sagt es Ihnen, wenn eine Inhaltsdatei als ausführbare Datei abgelegt wurde und die entpackte Kopie es nicht sein wird. Das wird aus dem Container gelesen und nicht aus dem Namen geraten.

Namen werden mit ausgeschriebenen Zeichen gezeigt, die Text umordnen, damit sich eine Inhaltsdatei nicht als ein Dateityp ausgeben kann, während sie ein anderer ist.

Wo Ihr System nicht sagt, was eine Inhaltsdatei öffnet, sagt Slipcase nichts, statt zu raten. Es bringt keine Tabelle mit, die Dateinamen auf Typen abbildet, und sieht nie in eine Inhaltsdatei hinein, um einen zu erraten. Was Sie bekommen, sind Auskünfte — woher die Datei kam, was sie war, ob der Container wohlgeformt ist — und die Entscheidung bleibt Ihre.

WAS ES NICHT TUT

Keinerlei Netzwerkverbindung. Kein Konto. Keine Telemetrie, keine Analyse, keine Absturzberichte. Nichts über Sie oder Ihre Dateien wird irgendwohin gesendet, weil es nirgendwohin zu senden gibt.

Es zeigt keine Vorschau: die Inhaltsdatei wird einem anderen Programm übergeben, statt hier dargestellt zu werden. Ein Container hält eine Inhaltsdatei, was das Format entscheidet und nicht dieses Programm.

OPEN SOURCE

Slipcase ist Open Source, und ebenso das Format, das es liest, und die Bibliothek, die es liest. Jede Aussage oben ist überprüfbar: github.com/excelano/slipcase-desktop.
"""

[locales."de-de".apple]
name = "Slipcase Desktop"
subtitle = "Das Flyleaf, das mitreist"
promotional-text = "Einen Container aus einer Datei erstellen oder einen öffnen, das mitgereiste Flyleaf bearbeiten und die Inhaltsdatei dem Programm übergeben, das sie öffnet."
keywords = "Flyleaf,Container,slpc,Archiv,TOML,Datei,Dokument,Verschlagwortung,zip"

