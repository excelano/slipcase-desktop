<?xml version="1.0" encoding="UTF-8"?>
<!--
  Slipcase: a card sliding into an open-topped case.

  Author: David M. Anderson
  Built with AI assistance (Claude, Anthropic)

  Drawn on a 64-unit grid with 3-unit strokes, so it survives the 16-pixel size
  a file manager uses in a list. The card is drawn first and the case over it,
  which is what puts the card inside rather than in front. Two shapes and one
  band: anything finer than this is mud at 16 pixels, which is where it was
  checked.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g stroke="#2f3337" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- The card, protruding well above the case's mouth. -->
    <rect x="20" y="4" width="25" height="36" rx="2" fill="#f2ece1"/>
    <g stroke="#9aa1a8" stroke-width="2.5">
      <line x1="26" y1="14" x2="39" y2="14"/>
      <line x1="26" y1="21" x2="39" y2="21"/>
    </g>
    <!-- The case: open along the top, closed on the other three sides. -->
    <path d="M8 31 h48 v22 a4 4 0 0 1 -4 4 h-40 a4 4 0 0 1 -4 -4 z" fill="#4a6fa5"/>
    <!-- The mouth, a darker band so the top edge reads as an opening. -->
    <path d="M8 31 h48 v7 h-48 z" fill="#38557f" stroke="none"/>
    <path d="M8 38 h48" fill="none"/>
  </g>
</svg>
