# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.1.10"

[locales]
[locales.de-de]
whats-new = "Der Slipcase-Containertyp ist jetzt registriert. Die IANA hat am 16. September 2026 application/vnd.excelano.slipcase+zip vergeben, und Slipcase meldet Container unter diesem Namen an — unter Windows, macOS und Linux. Der vorläufige Name davor gehörte in einen Bereich für geschlossene Umgebungen, und dort gehört ein Format nicht hin, das in App-Stores erscheint.\n\nAn den Containern ändert sich nichts. Der Typ stand noch nie in einem Container, deshalb bleiben Dateien aus früheren Versionen dieselben Dateien: Sie öffnen sich wie bisher und behalten ihr Symbol. Unter Linux löst der alte Name weiterhin auf, denn die Datenbank der Medientypen führt ihn als Alias des registrierten. Unter Windows und macOS gibt es das nicht, dort ersetzt die Installation die alte Anmeldung, statt sie neben der neuen stehen zu lassen.\n\nEs gibt nichts auszuwählen und nichts umzustellen."
[locales.en-us]
whats-new = "The Slipcase container type is now registered. IANA assigned application/vnd.excelano.slipcase+zip on 16 September 2026, and Slipcase registers containers under that name on Windows, macOS and Linux. The provisional name it replaces belonged to a tree meant for closed settings, which is not where a format that ships in application stores belongs.\n\nNo container changes. The type has never been written inside one, so files made by earlier versions are the same files: they open the same way and keep the same icon. On Linux the old name still resolves, because the media type database records it as an alias of the registered one. On Windows and macOS, which have no such mechanism, installing this version replaces the old registration rather than leaving it beside the new one.\n\nThere is nothing to choose and nothing to migrate."
