# Run the suite on Apple silicon, because nothing else here can.
#
# Every machine this application has been built and walked through on is
# x86_64, and a Store build has to be universal. `cargo build --target
# aarch64-apple-darwin` cross-compiles on an Intel Mac but cannot run what it
# produces, so the arm64 half of a released bundle was, until this file, code
# nobody had ever executed.
#
# What this reaches is worth being precise about. The tests are not a token
# check: `opens_with` asks Launch Services, `provenance` reads and writes
# `com.apple.quarantine`, and `staging` calls `-[NSFileManager
# replaceItemAtURL:]`. All three are real platform calls, and the corpus drives
# the save path 111 times through them.
#
# It reaches the window now, which this file used to say it could not.
# `src/opened_document.rs` receives a double-clicked document through an Apple
# Event, and `open` on a container goes through Launch Services and produces the
# same event Finder does — so the last step below opens one and asks the window
# server whether a window appeared. That is the one piece of the arm64
# walkthrough no test could reach, and the module it exercises is the only
# `unsafe` in this crate.
#
# **It asks the window server rather than looking at a screenshot, and the
# difference is the whole point.** `CHECKLIST.md` records `screencapture`
# returning the desktop with every window omitted while reporting no error, so a
# job asserting on pixels would go green against a build that drew nothing. A
# screenshot is still uploaded, as something for a person to look at rather than
# something this job claims anything about.
#
# What it still does not reach is a sandbox, which needs a signing identity no
# runner has; a high-density display; and the Finder icon. `CHECKLIST.md` holds
# those and a green run here does not stand in for them.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Apple silicon

on:
  push:
  pull_request:

jobs:
  arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # The architecture is the whole reason this workflow exists, and a label
      # is a promise rather than a fact: `macos-13` is Intel and `macos-14`
      # onwards is Apple silicon, which is a mapping GitHub can change. Checked,
      # so that this fails loudly rather than quietly testing x86_64 twice.
      - name: The runner is Apple silicon
        run: |
          arch=$(uname -m)
          echo "runner reports ${arch}"
          [ "$arch" = arm64 ] || {
            echo "this workflow exists to test arm64 and the runner is ${arch}" >&2
            exit 1
          }

      - name: What is installed
        run: rustc -V && cargo -V && python3 -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # `CLAUDE.md` says clippy must be silent, so a warning is an error here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The corpus is a command and never a test, because it needs a checkout of
      # another repository with its cases generated and a test that skips
      # quietly on a machine that was never going to have those things is worse
      # than a command run on purpose. CI is a machine that can always have
      # them, so it runs it on purpose. `generate.py` needs Python 3.11 for
      # `tomllib`, which the runner has and the Intel Mac this was written on
      # did not. It resolves its manifest and its output directory from its own
      # location rather than the working directory, so it is run by path and
      # needs no `cd` and no `--out`.
      # Pinned rather than tracking `main`. This clones another repository and
      # runs a Python file out of it, before the build, on every push — so
      # whoever can land a commit there executes code here. `excelano/slipcase`
      # is ours and `generate.py` is read before every bump, but "ours" is not a
      # security boundary and the corpus's own argument for determinism wants a
      # fixed input anyway. Bump this deliberately when the corpus changes.
      #
      # SPEC-PIN: 62e95424d459776c5a49b8de3a3f6177af5de050
      - name: The conformance corpus, every case
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/excelano/slipcase.git "${RUNNER_TEMP}/slipcase"
          git -C "${RUNNER_TEMP}/slipcase" checkout --detach 62e95424d459776c5a49b8de3a3f6177af5de050
          python3 "${RUNNER_TEMP}/slipcase/conformance/generate.py"
          cargo run --bin corpus -- "${RUNNER_TEMP}/slipcase/conformance"

      # The bundle is the unit: a bare executable has no bundle identifier and
      # Launch Services files it as a nameless foreground process, so nothing
      # can be associated with it and no Apple Event reaches it. Built from the
      # debug binary the steps above already produced — `--binary` exists for
      # this — because a release build here would cost minutes to answer a
      # question that does not depend on optimisation.
      - name: Assemble the bundle
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          ./packaging/macos/build-app.sh --binary "${target}/debug/slipcase-desktop"
          lipo -info dist/Slipcase.app/Contents/MacOS/slipcase-desktop

      # The step this workflow was missing. `open` reaches Launch Services and
      # delivers the Apple Event a double-click delivers, so this is
      # `src/opened_document.rs` running on arm64 — and that module was
      # documented as impossible before it was written, which is reason enough
      # to watch it rather than trust it.
      - name: A container opens, and a window appears
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -f "$PWD/dist/Slipcase.app"

          swiftc -O packaging/macos/window-probe.swift -o "${RUNNER_TEMP}/window-probe"

          container="${RUNNER_TEMP}/slipcase/conformance/cases/accept/minimal.slpc"
          [ -f "$container" ] || { echo "no container at $container" >&2; exit 1; }
          open -a "$PWD/dist/Slipcase.app" "$container"

          # Cold launch, a window server, and a first frame. Polled rather than
          # slept at, so a fast answer is fast and a slow one still gets its
          # chance; 30 seconds is far past anything measured by hand.
          for _ in $(seq 1 15); do
            sleep 2
            "${RUNNER_TEMP}/window-probe" Slipcase >/dev/null 2>&1 && break
          done

          set +e
          "${RUNNER_TEMP}/window-probe" Slipcase
          verdict=$?
          set -e
          case "$verdict" in
            0)
              echo "the arm64 build drew a window for a container opened through Launch Services"
              ;;
            2)
              # Not a failure of the application, and deliberately not a pass
              # either: a check that can quietly not check is the thing this
              # repository keeps getting caught by.
              echo "::error::The window server listed nothing, so this run answered nothing about the window. Decide whether this runner can host one at all before trusting a green tick here."
              exit 1
              ;;
            *)
              echo "::error::No window appeared for a container opened through Launch Services on arm64. This is src/opened_document.rs, the only unsafe in this crate."
              exit 1
              ;;
          esac

      # For eyes, not for the verdict. The step above is what passes or fails.
      - name: Photograph it, for a person
        if: always()
        run: |
          screencapture -x "${RUNNER_TEMP}/screen.png" || true
          ls -l "${RUNNER_TEMP}/screen.png" || true

      - name: Keep the photograph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-window
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: warn
