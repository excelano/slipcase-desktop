# The Windows checks a machine can run: that the tree builds and passes here,
# that the shipped binary imports nothing Windows does not have, that the
# install scripts go on and come off cleanly, that the committed icons still
# match the drawings they were generated from, the conformance corpus, and, on
# a release, the unsigned Store package. Out of reach: the window, the
# certification kit, and the icon as a person sees it at any size.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Windows

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
  pull_request:
  # The release event is what attaches the package. A person's token creates
  # the release, so the event fires.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package for (e.g. v0.1.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      # The packaging scripts are the only code here that nothing else compiles
      # or runs, and there is no PowerShell on the Linux lane. The step is
      # excelano/.github's because it is the same one in every repository that
      # has them.
      - name: The packaging scripts parse
        uses: excelano/.github/.github/actions/powershell-parses@main

      - name: What is installed
        run: |
          rustc -V
          cargo -V
          python -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # `CLAUDE.md` says clippy must be silent, so a warning is an error here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The check that Slipcase 0.1.1 needed and did not have. It was packaged,
      # certified by the Windows App Certification Kit, submitted, and failed
      # Store policy 10.2.4.1 because it imported VCRUNTIME140.dll from the
      # Visual C++ Redistributable - so on the tester's clean machine it
      # installed and then would not start. Nothing in this file could have
      # caught it: a GitHub runner has Visual Studio, exactly like every
      # machine this project has ever built on.
      #
      # `.cargo/config.toml` is the fix and this is the guard on it. A
      # dependency added on any of the three platforms can pull in a DLL that
      # is not part of Windows without anybody here noticing, and the day that
      # happens is the day this step has to be the thing that says so.
      #
      # The release binary rather than the debug one, because the release
      # binary is what ships and is the only one whose import table is the
      # artefact's.
      - name: Every DLL the shipped binary imports comes with Windows
        run: |
          cargo build --release
          powershell -ExecutionPolicy Bypass -File packaging/windows/check-imports.ps1

      # The install scripts against the registry, read back. The steps are
      # excelano/.github's: it was the same script in three repositories and
      # absent from three more, and the absent ones included the repository
      # whose uninstall reported success while leaving the association dead.
      - name: The integration goes on and comes off cleanly
        uses: excelano/.github/.github/actions/windows-install-check@main
        with:
          associations: '[{"extension": ".slpc", "progId": "Excelano.Slipcase", "contentType": "application/x.slipcase+zip"}]'
          owns-extension: 'true'
          install-args: '-NoBinary'

      # The run that found the device-name defect in the first place, and the
      # only platform where `accept/payload-name-windows-reserved` is anything
      # but an ordinary filename. It hung here for ten minutes twice before the
      # case had a name, so a timeout is set: a run that hangs looks exactly
      # like a run that is slow, and the whole job's default of six hours is the
      # wrong thing to find out at.
      # Pinned rather than tracking `main`. This clones another repository and
      # runs a Python file out of it, before the build, on every push — so
      # whoever can land a commit there executes code here. `excelano/slipcase`
      # is ours and `generate.py` is read before every bump, but "ours" is not a
      # security boundary and the corpus's own argument for determinism wants a
      # fixed input anyway. Bump this deliberately when the corpus changes.
      #
      # SPEC-PIN: 996dcca3f65ed36728b11ee1741812b50def67b4
      - name: The conformance corpus, every case
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/excelano/slipcase.git "${env:RUNNER_TEMP}\slipcase"
          git -C "${env:RUNNER_TEMP}\slipcase" checkout --detach 996dcca3f65ed36728b11ee1741812b50def67b4
          python "${env:RUNNER_TEMP}\slipcase\conformance\generate.py"
          cargo run --example corpus -- "${env:RUNNER_TEMP}\slipcase\conformance"

      # The `.ico` is a committed artifact rather than a build product, because
      # `rc.exe` and `windres` are both tools `DESIGN.md` §2 keeps out of the
      # build. A committed artifact can fall out of step with the source it was
      # generated from and nothing would say so, so the generator is run and its
      # output compared against what is in the tree.
      #
      # The same generator now writes the five PNGs `AppxManifest.xml` names,
      # for the same reason and with the same exposure: nothing on Windows
      # rasterizes an SVG, so those are committed too. The comparison is over
      # the whole directory rather than the one file, because an asset that
      # drifted from the drawing would otherwise reach a store listing with
      # nothing having looked at it.
      - name: The committed icon and Store assets still match their generator
        run: |
          cd packaging/windows/make-ico
          cargo run --release
          cd ../../..
          git diff --exit-code -- packaging/windows/slipcase.ico packaging/windows/assets packaging/windows/listing

      # The Store takes the package unsigned, and the runner assembles the one that
      # is uploaded. The steps are excelano/.github's, because they were the same in
      # every repository that has this target; the publisher is the organisation
      # secret, being the one value in the identity that is an account's rather than
      # this product's.
      - name: The Store package
        uses: excelano/.github/.github/actions/store-package@main
        with:
          publisher: ${{ secrets.STORE_PUBLISHER }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
