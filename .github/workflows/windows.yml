# Run the suite on Windows, check the things only a Windows machine can say,
# and assemble the Store package, attaching it to a published release. The
# checks themselves live in excelano/.github so every desktop-app repo in the
# fleet runs the same ones and a correction reaches all of them at once; what
# stays here is this product's own names, paths, screenshot recipe and the
# pinned conformance corpus.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what attaches the package. A person's token creates
  # the release, so the event fires.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # package is attached to that release; without one it is built and kept
      # as an artefact.
      tag:
        description: 'Tag to package for (e.g. v0.1.9)'
        required: false
        type: string
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']

permissions:
  contents: write

jobs:
  windows:
    uses: excelano/.github/.github/workflows/windows-desktop-ci.yml@main
    with:
      tag: ${{ inputs.tag }}
      binary-names: slipcase-desktop
      icon-check: true
      icon-check-paths: 'packaging/windows/slipcase.ico packaging/windows/assets packaging/windows/listing'
      install-check-associations: '[{"extension": ".slpc", "progId": "Excelano.Slipcase", "contentType": "application/vnd.excelano.slipcase+zip"}]'
      install-check-owns-extension: 'true'
      screenshots: ${{ inputs.screenshots }}
      shot-out: dist/store
      # Info-ZIP's zip, which Git for Windows does not ship, and `7z` is not a
      # substitute: its archives differ from Info-ZIP's in the bytes, and the
      # same bytes on every machine is what makes the container in the
      # pictures the container a reviewer downloads. One per language: the
      # flyleaf tree is most of what these frames show, so a German listing
      # opening an English document would be mostly English pixels whatever
      # language the window is in. The container is opened through the shell,
      # so the association has to exist; the install check above takes its
      # own registration away again.
      pre-screenshot-script: |
        choco install zip --no-progress -y
        bash packaging/demo-container.sh
        bash packaging/demo-container.sh --lang de
        powershell -ExecutionPolicy Bypass -File packaging/windows/install.ps1
      # The run that found the device-name defect in the first place. Pinned
      # rather than tracking `main`: this clones another repository and runs a
      # Python file out of it, before the build, on every push - so whoever
      # can land a commit there executes code here. `excelano/slipcase` is
      # ours and `generate.py` is read before every bump, but "ours" is not a
      # security boundary and the corpus's own argument for determinism wants
      # a fixed input anyway. Bump this deliberately when the corpus changes.
      #
      # SPEC-PIN: 69709be1dc3c8e77fd0954df59f913dbaccad3ab
      release-only-script: |
        git clone --filter=blob:none --no-checkout https://github.com/excelano/slipcase.git "${env:RUNNER_TEMP}\slipcase"
        git -C "${env:RUNNER_TEMP}\slipcase" checkout --detach 69709be1dc3c8e77fd0954df59f913dbaccad3ab
        python "${env:RUNNER_TEMP}\slipcase\conformance\generate.py"
        cargo run --example corpus -- "${env:RUNNER_TEMP}\slipcase\conformance"
    secrets: inherit
